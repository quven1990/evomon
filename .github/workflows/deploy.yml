# Push to main → build → Cloudflare Pages deploy → purge CDN cache.
#
# Required GitHub secret: CLOUDFLARE_API_TOKEN
# Create at https://dash.cloudflare.com/profile/api-tokens → Create Custom Token
#
# Permissions (all required):
#   Account  → Cloudflare Pages     → Edit
#   Account  → Account Settings    → Read
#   User     → User Details        → Read
#   User     → Memberships         → Read
#   Zone     → Cache Purge          → Purge
#   Zone     → Zone                 → Read
#   Zone     → Page Rules           → Edit   (optional; needed to manage HTML cache via API)
#
# Account resources: Include → your account
# Zone resources:    Include → evomon.cc
#
# HTML edge cache (Free plan): Pages serves HTML as DYNAMIC unless a rule
# marks it eligible. Add in Dashboard → Caching → Cache Rules (or Page Rules):
#   1) evomon.cc/_next/static/*  → Cache Everything, Edge TTL = 1 month
#   2) evomon.cc/*               → Cache Everything, Edge TTL = 10 minutes,
#                                  Browser TTL = Respect Existing Headers
# Rule 1 must be higher priority than rule 2. Deploy purge clears both.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-evomon-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need HEAD~1 so IndexNow can stream only URLs changed in this commit
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, deploy to Cloudflare Pages, purge cache
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a17c720d27e1e3b502bef6b0d57c5472
          # Adsterra master switch (build-time). Flip in:
          #   Repo → Settings → Secrets and variables → Actions → Variables
          #   name: NEXT_PUBLIC_ADSTERRA_ENABLED  value: true | false
          # Unset / false → ads off (temporary A/B default in src/lib/adsterra.ts).
          # Set true → resume Adsterra after redeploy.
          NEXT_PUBLIC_ADSTERRA_ENABLED: ${{ vars.NEXT_PUBLIC_ADSTERRA_ENABLED || 'false' }}
