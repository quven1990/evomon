      (async function () {
        // Block mainland China — Adsterra often serves scam redirect creatives there.
        try {
          var trace = await fetch("/cdn-cgi/trace", { cache: "no-store" }).then(function (r) {
            return r.text();
          });
          var m = /^loc=(.+)$/m.exec(trace);
          if (m && m[1].trim().toUpperCase() === "CN") {
            document.body.textContent = "";
            return;
          }
        } catch (e) {
          /* continue */
        }

        window.atOptions = {
          key: "6d1af51817130afbe57903ad47282ac0",
          format: "iframe",
          height: 250,
          width: 300,
          params: {},
        };
        var s = document.createElement("script");
        s.type = "text/javascript";
        s.src =
          "https://www.highperformanceformat.com/6d1af51817130afbe57903ad47282ac0/invoke.js";
        document.body.appendChild(s);
      })();
    </script>
